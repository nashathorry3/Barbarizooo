spring:
  application:
    name: barbarizoo-backend
  # Default profile runs on in-memory H2 so the API is runnable with zero setup.
  datasource:
    url: jdbc:h2:mem:barbarizoo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  # SMTP for real email reminders (only used when notifications.provider=email).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

barbarizoo:
  # Fallback tenant used for public requests with no X-Tenant-Id header (matches seed data).
  default-tenant-id: "11111111-1111-1111-1111-111111111111"
  cors:
    # Comma-separated list of allowed frontend origins. Set CORS_ALLOWED_ORIGINS
    # to your deployed frontend URL(s) in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Override in production via BARBARIZOO_JWT_SECRET. Must be >= 32 chars (HS256).
    secret: ${BARBARIZOO_JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum!!}
    expiration-minutes: 720
  google:
    # "mock" (default, dev) accepts a "mock|email|name|sub" token for local testing.
    # "real" verifies genuine Google ID tokens against the client id below.
    mode: ${GOOGLE_AUTH_MODE:mock}
    client-id: ${GOOGLE_CLIENT_ID:}
  notifications:
    # "simulated" (default, logs) or "email" (real SMTP via spring.mail.* above).
    provider: ${NOTIFICATIONS_PROVIDER:simulated}
    from-email: ${MAIL_FROM:no-reply@barbarizoo.de}
    from-name: ${MAIL_FROM_NAME:Barbarizoo}
  payments:
    # Deposit charged at booking to reduce no-shows (% of the slot price).
    deposit-percent: 30
    # When true, a new booking stays PENDING until the deposit is paid, then CONFIRMED.
    require-deposit: true
    # "simulated" (default, no external account) or "stripe" (real).
    provider: ${PAYMENTS_PROVIDER:simulated}
    # Required when provider=stripe.
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    com.barbarizoo: INFO
