name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify = compile + run tests + package the jar.
      - name: Build & test
        run: mvn -B clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/barbarizoo-backend-*.jar
          if-no-files-found: error

  frontend:
    name: Frontend · type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next build runs TypeScript type-checking and fails on type errors.
      - name: Build
        run: npm run build

  docker:
    name: Backend · Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      # Validates the Dockerfile + deploy path without pushing the image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: barbarizoo-api:ci
