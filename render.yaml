# Render Blueprint — provisions the whole Barbarizoo stack in one click.
# In Render: New → Blueprint → connect this repo. Review env vars, then Apply.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: barbarizoo-db
    databaseName: barbarizoo
    user: barbarizoo
    region: frankfurt # EU data residency (GDPR)
    plan: free

services:
  # ---- Backend: Spring Boot API (Docker) ----
  - type: web
    name: barbarizoo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/services
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Database connection pulled straight from the managed Postgres above.
      - key: DB_URL
        fromDatabase:
          name: barbarizoo-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: barbarizoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: barbarizoo-db
          property: password
      # Strong JWT secret generated by Render (>= 32 chars).
      - key: BARBARIZOO_JWT_SECRET
        generateValue: true
      # Allow the frontend to call the API (set after the frontend URL is known).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # --- Optional: real Stripe (defaults to simulated if unset) ---
      - key: PAYMENTS_PROVIDER
        value: simulated
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Optional: real Google Sign-In (defaults to mock if unset) ---
      - key: GOOGLE_AUTH_MODE
        value: mock
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ---- Frontend: Next.js app (Node) ----
  - type: web
    name: barbarizoo-web
    runtime: node
    rootDir: frontend
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      # Point the frontend at the API. Set to the full https:// URL of the
      # barbarizoo-api service once it's created (NEXT_PUBLIC_* is baked in at
      # build time, so it must be a complete URL, e.g.
      # https://barbarizoo-api.onrender.com).
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      # --- Optional: match the backend's Stripe / Google config ---
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
