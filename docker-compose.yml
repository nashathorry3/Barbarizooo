# Full Barbarizoo stack for a single VPS (e.g. Hostinger KVM).
# Caddy terminates HTTPS (auto Let's Encrypt) and reverse-proxies to web + api.
#
#   cp .env.example .env   # then fill in DOMAIN, API_DOMAIN, passwords, keys
#   docker compose up -d --build
#
# DNS: point DOMAIN and API_DOMAIN A-records at the VPS IP first.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbarizoo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d barbarizoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/barbarizoo
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BARBARIZOO_JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-simulated}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_AUTH_MODE: ${GOOGLE_AUTH_MODE:-mock}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

  web:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time — must be the public API URL.
        NEXT_PUBLIC_API_BASE: https://${API_DOMAIN}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    depends_on:
      - web
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
